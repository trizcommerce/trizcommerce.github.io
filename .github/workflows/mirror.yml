# 예전 주소(trizcommerce.github.io/<셀러>/) 거울: 새 주소(trizcommerce-team.github.io)의 캘린더를 15분마다 복사해 배포
name: 예전 주소 거울

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 새 주소에서 복사
        env:
          PYTHONUTF8: "1"
        run: python mirror.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 업로드 처리 대기   # deploy-pages 가 방금 올린 결과물을 못 찾는 일시 오류 줄이기
        run: sleep 15
      - id: deploy
        uses: actions/deploy-pages@v4
