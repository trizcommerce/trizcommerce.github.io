# 임시: 원본 시트 화면 확인용 (확인 후 삭제)
name: 시트 확인 (임시)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/764836683471/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: calendar-reader@triz-calendar.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
      - env:
          T: ${{ steps.gauth.outputs.access_token }}
        run: |
          mkdir out; S=1MTLBlWcl9DvJGwltiB1Ks1ugitJz8p6d7OcDlZ416WA
          curl -sL -w "%{http_code} %{url_effective}
" -H "Authorization: Bearer $T" "https://sheets.googleapis.com/v4/spreadsheets/$S?fields=sheets.properties,sheets.conditionalFormats" -o out/meta.json
          curl -sL -w "%{http_code} %{url_effective}
" -H "Authorization: Bearer $T" "https://docs.google.com/spreadsheets/d/$S/export?format=pdf&portrait=false&fitw=true" -o out/all.pdf
          curl -sL -w "%{http_code} %{url_effective}
" -H "Authorization: Bearer $T" "https://docs.google.com/spreadsheets/d/$S/export?format=xlsx" -o out/all.xlsx
          for g in $(python3 -c "import json;print(' '.join(str(s['properties']['sheetId']) for s in json.load(open('out/meta.json')).get('sheets',[])))"); do
            curl -sL -w "%{http_code} %{url_effective}
" -H "Authorization: Bearer $T" "https://docs.google.com/spreadsheets/d/$S/htmlview/sheet?headers=true&gid=$g" -o out/view_$g.html || true
          done
          ls -la out; head -c 600 out/meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: peek
          path: out
          retention-days: 1
