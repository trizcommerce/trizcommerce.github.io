# 임시: 원본 시트 화면 확인용 (확인 후 삭제)
name: 시트 확인 (임시)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/764836683471/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: calendar-reader@triz-calendar.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
      - env:
          T: ${{ steps.gauth.outputs.access_token }}
        run: |
          mkdir out; S=1MTLBlWcl9DvJGwltiB1Ks1ugitJz8p6d7OcDlZ416WA
          get() { curl -sL -o "$2" -w "%{http_code} $2\n" -H "Authorization: Bearer $T" "$1"; }
          get "https://sheets.googleapis.com/v4/spreadsheets/$S?fields=sheets.properties,sheets.conditionalFormats" out/meta.json
          get "https://docs.google.com/spreadsheets/d/$S/export?format=pdf&portrait=false&fitw=true" out/all.pdf
          get "https://docs.google.com/spreadsheets/d/$S/export?format=xlsx" out/all.xlsx
          for g in $(python3 -c "import json;print(' '.join(str(s['properties']['sheetId']) for s in json.load(open('out/meta.json')).get('sheets',[])))"); do
            get "https://docs.google.com/spreadsheets/d/$S/htmlview/sheet?headers=true&gid=$g" out/view_$g.html
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: peek
          path: out
          retention-days: 1
